<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>FE8 Web Tactics - Full Battle Scene</title>
  <style>
    body { margin: 0; background: #1a1a2e; display: flex; flex-direction: column; align-items: center; color: #fff; font-family: monospace; padding-top: 5px; }
    #game-container { border: 2px solid #4ecca3; box-shadow: 0 4px 10px rgba(0,0,0,0.5); position: relative; }
    
    /* Khung giao tranh phong cách FE8 GBA bật lên khi đánh nhau */
    #battle-popup {
      position: absolute;
      top: 40px;
      left: 10px;
      width: 364px;
      height: 240px;
      background: rgba(16, 24, 48, 0.95);
      border: 3px solid #f1c40f;
      border-radius: 6px;
      display: none;
      flex-direction: column;
      justify-content: space-between;
      padding: 10px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.8);
      z-index: 100;
    }
    .battle-header { text-align: center; font-size: 14px; font-weight: bold; color: #f1c40f; border-bottom: 1px solid #444; padding-bottom: 4px; }
    .battle-combatants { display: flex; justify-content: space-around; align-items: center; height: 130px; }
    .combatant-panel { text-align: center; width: 45%; background: #0f172a; border: 1px solid #334155; padding: 6px; border-radius: 4px; }
    .combatant-name { font-size: 12px; color: #38bdf8; margin-bottom: 4px; }
    .combatant-hp { font-size: 14px; font-weight: bold; color: #22c55e; }
    .battle-log-sub { font-size: 11px; color: #cbd5e1; background: #020617; padding: 6px; border-radius: 3px; height: 40px; overflow-y: auto; }

    #log-box { width: 384px; height: 100px; background: #0f0f1a; border: 1px solid #444; margin-top: 8px; padding: 6px; overflow-y: auto; font-size: 11px; line-height: 1.3; border-radius: 4px; }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
</head>
<body>
  <div id="game-container">
    <!-- Khung giao tranh mô phỏng FE8 GBA xuất hiện đè lên bản đồ khi đánh nhau -->
    <div id="battle-popup">
      <div class="battle-header" id="bp-title">GIAO TRANH CHIẾN THUẬT</div>
      <div class="battle-combatants">
        <div class="combatant-panel">
          <div class="combatant-name" id="bp-att-name">Kiếm Sĩ</div>
          <div style="font-size:22px; margin: 6px 0;">⚔️</div>
          <div class="combatant-hp" id="bp-att-hp">HP: 24/24</div>
        </div>
        <div style="font-size: 18px; font-weight: bold; color: #f97316;">VS</div>
        <div class="combatant-panel">
          <div class="combatant-name" id="bp-def-name">Lính Đánh Thuê</div>
          <div style="font-size:22px; margin: 6px 0;">🛡️</div>
          <div class="combatant-hp" id="bp-def-hp">HP: 26/26</div>
        </div>
      </div>
      <div class="battle-log-sub" id="bp-sublog">Đang chuẩn bị giao tranh...</div>
    </div>
  </div>

  <div id="log-box">Chạm vào Kiếm Sĩ (Xanh) rồi bấm vào Địch cạnh bên để mở màn giao tranh chuẩn FE8!</div>

  <script>
    // --- LÕI TOÁN HỌC FE8 ---
    const WEAPON_TRIANGLE = {
      sword: { axe: { dmg: 1, hit: 15 }, lance: { dmg: -1, hit: -15 } },
      lance: { sword: { dmg: 1, hit: 15 }, axe: { dmg: -1, hit: -15 } },
      axe:   { lance: { dmg: 1, hit: 15 }, sword: { dmg: -1, hit: -15 } }
    };

    function roll2RN(displayHit) {
      const rn1 = Math.floor(Math.random() * 100);
      const rn2 = Math.floor(Math.random() * 100);
      return ((rn1 + rn2) / 2) < displayHit;
    }

    function getTriangleBonus(wA, wD) {
      return WEAPON_TRIANGLE[wA.type]?.[wD.type] || { dmg: 0, hit: 0 };
    }

    function calcAttackSpeed(unit) {
      const penalty = Math.max(0, unit.weapon.wt - unit.con);
      return Math.max(0, unit.spd - penalty);
    }

    function calculateBattlePreview(attacker, defender) {
      const triA = getTriangleBonus(attacker.weapon, defender.weapon);
      const triD = getTriangleBonus(defender.weapon, attacker.weapon);
      const asA = calcAttackSpeed(attacker);
      const asD = calcAttackSpeed(defender);

      const dmgA = Math.max(0, (attacker.str + attacker.weapon.mt + triA.dmg) - defender.def);
      const hitA = Math.max(0, Math.min(100, (attacker.weapon.hit + (attacker.skl * 2) + Math.floor(attacker.lck / 2) + triA.hit) - ((asD * 2) + defender.lck)));
      const critA = Math.max(0, Math.min(100, (attacker.weapon.crit + Math.floor(attacker.skl / 2)) - defender.lck));

      const dmgD = Math.max(0, (defender.str + defender.weapon.mt + triD.dmg) - attacker.def);
      const hitD = Math.max(0, Math.min(100, (defender.weapon.hit + (defender.skl * 2) + Math.floor(defender.lck / 2) + triD.hit) - ((asA * 2) + attacker.lck)));
      const critD = Math.max(0, Math.min(100, (defender.weapon.crit + Math.floor(defender.skl / 2)) - attacker.lck));

      return {
        attacker: { dmg: dmgA, hit: hitA, crit: critA, double: (asA - asD) >= 4 },
        defender: { dmg: dmgD, hit: hitD, crit: critD, double: (asD - asA) >= 4 }
      };
    }

    // --- GAME MAIN ---
    const TILE_SIZE = 48;
    const GRID_SIZE = 8;

    const unitsData = [
      {
        id: 'player1', name: 'Kiếm Sĩ (P1)', team: 'player', x: 1, y: 3, color: 0x3498db, borderColor: 0x2980b9,
        hp: 24, maxHp: 24, str: 9, skl: 12, spd: 13, lck: 6, def: 5, con: 8, mov: 5,
        weapon: { name: 'Iron Sword', type: 'sword', mt: 5, hit: 90, crit: 0, wt: 5, range: 1 }
      },
      {
        id: 'enemy1', name: 'Lính Đánh Thuê (E1)', team: 'enemy', x: 5, y: 3, color: 0xe74c3c, borderColor: 0xc0392b,
        hp: 26, maxHp: 26, str: 10, skl: 8, spd: 8, lck: 3, def: 6, con: 10, mov: 5,
        weapon: { name: 'Steel Blade', type: 'sword', mt: 11, hit: 70, crit: 0, wt: 12, range: 1 }
      }
    ];

    let selectedUnit = null;
    let moveTiles = [];

    function logMsg(text) {
      const box = document.getElementById('log-box');
      box.innerHTML += `<br>> ${text}`;
      box.scrollTop = box.scrollHeight;
    }

    class BattleScene extends Phaser.Scene {
      constructor() { super('BattleScene'); }

      preload() {
        // Nạp sẵn sprite sheet của bạn để sẵn sàng cắt khung làm hoạt hoạ chém nhau ở bước tiếp theo
        this.load.image('char1', 'Char1.jpg');
        this.load.image('char2', 'Char2.png');
      }

      create() {
        this.graphics = this.add.graphics();
        this.drawGrid();

        unitsData.forEach(u => {
          const container = this.add.container(u.x * TILE_SIZE + TILE_SIZE / 2, u.y * TILE_SIZE + TILE_SIZE / 2);
          const bg = this.add.rectangle(0, 0, 38, 38, u.color, 0.9);
          bg.setStrokeStyle(2, u.borderColor);
          const label = this.add.text(0, 0, u.team === 'player' ? 'P' : 'E', { 
            fontSize: '18px', fill: '#fff', fontStyle: 'bold', fontFamily: 'monospace' 
          }).setOrigin(0.5);

          const hpBarBg = this.add.rectangle(0, 22, 36, 4, 0x000000);
          const hpBar = this.add.rectangle(-18, 22, 36, 4, 0x2ecc71).setOrigin(0, 0.5);

          container.add([bg, label, hpBarBg, hpBar]);
          u.sprite = container;
          u.hpBar = hpBar;
        });

        this.input.on('pointerdown', (pointer) => {
          const gx = Math.floor(pointer.x / TILE_SIZE);
          const gy = Math.floor(pointer.y / TILE_SIZE);
          if (gx >= 0 && gx < GRID_SIZE && gy >= 0 && gy < GRID_SIZE) {
            this.handleTileClick(gx, gy);
          }
        });
      }

      drawGrid() {
        this.graphics.clear();
        for (let y = 0; y < GRID_SIZE; y++) {
          for (let x = 0; x < GRID_SIZE; x++) {
            this.graphics.lineStyle(1, 0x33334d, 1);
            this.graphics.fillStyle((x + y) % 2 === 0 ? 0x22223b : 0x2a2a4a, 1);
            this.graphics.fillRect(x * TILE_SIZE, y * TILE_SIZE, TILE_SIZE, TILE_SIZE);
            this.graphics.strokeRect(x * TILE_SIZE, y * TILE_SIZE, TILE_SIZE, TILE_SIZE);
          }
        }

        moveTiles.forEach(t => {
          this.graphics.fillStyle(0x2ecc71, 0.4);
          this.graphics.fillRect(t.x * TILE_SIZE, t.y * TILE_SIZE, TILE_SIZE, TILE_SIZE);
        });
      }

      handleTileClick(gx, gy) {
        const clickedUnit = unitsData.find(u => u.x === gx && u.y === gy && u.hp > 0);

        if (clickedUnit && clickedUnit.team === 'player') {
          selectedUnit = clickedUnit;
          this.calcMoveRange(selectedUnit);
          this.drawGrid();
          logMsg(`Đã chọn ${selectedUnit.name} (HP: ${selectedUnit.hp}/${selectedUnit.maxHp})`);
          return;
        }

        if (selectedUnit) {
          if (clickedUnit && clickedUnit.team === 'enemy') {
            const dist = Math.abs(selectedUnit.x - clickedUnit.x) + Math.abs(selectedUnit.y - clickedUnit.y);
            if (dist === 1) {
              this.startBattlePopup(selectedUnit, clickedUnit);
              selectedUnit = null;
              moveTiles = [];
              this.drawGrid();
              return;
            }
          }

          if (moveTiles.some(t => t.x === gx && t.y === gy) && !clickedUnit) {
            selectedUnit.x = gx;
            selectedUnit.y = gy;
            this.tweens.add({
              targets: selectedUnit.sprite,
              x: gx * TILE_SIZE + TILE_SIZE / 2,
              y: gy * TILE_SIZE + TILE_SIZE / 2,
              duration: 200
            });
            logMsg(`${selectedUnit.name} di chuyển đến (${gx}, ${gy}). Bấm vào địch cạnh bên để đánh!`);
            this.calcMoveRange(selectedUnit);
            this.drawGrid();
          }
        }
      }

      calcMoveRange(unit) {
        moveTiles = [];
        for (let y = 0; y < GRID_SIZE; y++) {
          for (let x = 0; x < GRID_SIZE; x++) {
            if (Math.abs(unit.x - x) + Math.abs(unit.y - y) <= unit.mov) {
              moveTiles.push({ x, y });
            }
          }
        }
      }

      // Kích hoạt khung giao tranh mô phỏng FE8 GBA
      startBattlePopup(att, def) {
        const popup = document.getElementById('battle-popup');
        const attName = document.getElementById('bp-att-name');
        const defName = document.getElementById('bp-def-name');
        const attHp = document.getElementById('bp-att-hp');
        const defHp = document.getElementById('bp-def-hp');
        const sublog = document.getElementById('bp-sublog');

        popup.style.display = 'flex';
        attName.innerText = att.name;
        defName.innerText = def.name;
        attHp.innerText = `HP: ${att.hp}/${att.maxHp}`;
        defHp.innerText = `HP: ${def.hp}/${def.maxHp}`;
        sublog.innerHTML = `Bắt đầu giao tranh giữa ${att.name} và ${def.name}!`;

        const preview = calculateBattlePreview(att, def);
        logMsg(`--- GIAO TRANH: ${att.name} vs ${def.name} ---`);

        // Dùng thời gian trễ (setTimeout) để hiển thị lần lượt các đòn đánh như GBA thật
        let step = 0;
        const interval = setInterval(() => {
          if (step === 0) {
            // Lượt 1: Attacker đánh
            sublog.innerHTML = `${att.name} ra đòn!`;
            this.performStrike(att, def, preview.attacker, attHp, defHp, sublog);
          } else if (step === 1) {
            // Lượt 2: Defender phản công (nếu còn sống)
            if (def.hp > 0) {
              sublog.innerHTML = `${def.name} phản công!`;
              this.performStrike(def, att, preview.defender, defHp, attHp, sublog);
            } else {
              sublog.innerHTML = `${def.name} đã gục ngã!`;
            }
          } else if (step === 2) {
            // Lượt 3: Đòn bồi tốc độ (nếu có)
            if (att.hp > 0 && def.hp > 0 && preview.attacker.double) {
              sublog.innerHTML = `${att.name} đánh bồi đòn 2!`;
              this.performStrike(att, def, preview.attacker, attHp, defHp, sublog);
            }
          } else {
            // Kết thúc giao tranh sau 3 giây
            clearInterval(interval);
            setTimeout(() => {
              popup.style.display = 'none';
              logMsg(`Hoàn thành giao tranh.`);
            }, 1200);
          }
          step++;
        }, 1000);
      }

      performStrike(att, def, stats, attHpUI, defHpUI, sublog) {
        if (roll2RN(stats.hit)) {
          const isCrit = (Math.random() * 100) < stats.crit;
          const finalDmg = isCrit ? stats.dmg * 3 : stats.dmg;
          def.hp = Math.max(0, def.hp - finalDmg);
          
          const hpPercent = def.hp / def.maxHp;
          def.hpBar.setScale(Math.max(0, hpPercent), 1);

          // Cập nhật giao diện trong popup giao tranh
          if(att.team === 'player') {
            defHpUI.innerText = `HP: ${def.hp}/${def.maxHp}`;
          } else {
            attHpUI.innerText = `HP: ${att.hp}/${att.maxHp}`;
          }

          logMsg(`💥 ${att.name} trúng${isCrit ? ' CHÍ MẠNG' : ''}! ${def.name} -${finalDmg} HP (Còn ${def.hp}/${def.maxHp})`);
          sublog.innerHTML = `💥 Trúng${isCrit ? ' CHÍ MẠNG' : ''}! -${finalDmg} HP`;

          if (def.hp === 0) {
            logMsg(`💀 ${def.name} đã gục ngã!`);
            def.sprite.setVisible(false);
          }
        } else {
          logMsg(`💨 ${att.name} đánh trượt!`);
          sublog.innerHTML = `💨 Đánh trượt!`;
        }
      }
    }

    new Phaser.Game({
      type: Phaser.AUTO,
      width: TILE_SIZE * GRID_SIZE,
      height: TILE_SIZE * GRID_SIZE,
      parent: 'game-container',
      pixelArt: true,
      scene: BattleScene
    });
  </script>
</body>
</html>
