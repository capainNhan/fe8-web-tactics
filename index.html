<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>FE8 Web Tactics</title>
  <style>
    body { margin: 0; background: #1a1a2e; display: flex; flex-direction: column; align-items: center; color: #fff; font-family: monospace; padding-top: 10px; }
    #game-container { border: 2px solid #4ecca3; box-shadow: 0 4px 10px rgba(0,0,0,0.5); position: relative; width: 384px; height: 384px; }
    #battle-popup {
      position: absolute; top: 40px; left: 10px; width: 360px; height: 220px;
      background: rgba(15, 23, 42, 0.95); border: 3px solid #f1c40f; border-radius: 6px;
      display: none; flex-direction: column; justify-content: space-between; padding: 10px; z-index: 100;
    }
    .b-header { text-align: center; font-size: 14px; font-weight: bold; color: #f1c40f; border-bottom: 1px solid #444; padding-bottom: 4px; }
    .b-body { display: flex; justify-content: space-around; align-items: center; height: 110px; }
    .b-box { text-align: center; width: 45%; background: #020617; border: 1px solid #334155; padding: 6px; border-radius: 4px; }
    .b-sublog { font-size: 11px; color: #cbd5e1; background: #020617; padding: 6px; border-radius: 3px; height: 35px; }
    #log-box { width: 380px; height: 110px; background: #0f0f1a; border: 1px solid #444; margin-top: 10px; padding: 6px; overflow-y: auto; font-size: 11px; line-height: 1.3; border-radius: 4px; }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
</head>
<body>
  <div id="game-container">
    <div id="battle-popup">
      <div class="b-header">GIAO TRANH CHIẾN THUẬT FE8</div>
      <div class="b-body">
        <div class="b-box">
          <div id="bp-att" style="color:#38bdf8; font-weight:bold;">Kiếm Sĩ</div>
          <div style="font-size:20px; margin:4px 0;">⚔️</div>
          <div id="bp-att-hp" style="color:#22c55e; font-size:13px;">HP: 24/24</div>
        </div>
        <div style="font-weight:bold; color:#f97316;">VS</div>
        <div class="b-box">
          <div id="bp-def" style="color:#f87171; font-weight:bold;">Lính Thuê</div>
          <div style="font-size:20px; margin:4px 0;">🛡️</div>
          <div id="bp-def-hp" style="color:#22c55e; font-size:13px;">HP: 26/26</div>
        </div>
      </div>
      <div class="b-sublog" id="bp-sub">Đang giao tranh...</div>
    </div>
  </div>
  <div id="log-box">Chạm vào Kiếm Sĩ (Xanh) rồi bấm vào Địch cạnh bên để đánh!</div>

  <script>
    const TILE_SIZE = 48;
    const GRID_SIZE = 8;
    const unitsData = [
      { id: 'p1', name: 'Kiếm Sĩ', team: 'player', x: 1, y: 3, color: 0x3498db, hp: 24, maxHp: 24, str: 9, skl: 12, spd: 13, lck: 6, def: 5, con: 8, mov: 5, weapon: { type: 'sword', mt: 5, hit: 90, crit: 0, wt: 5 } },
      { id: 'e1', name: 'Lính Thuê', team: 'enemy', x: 5, y: 3, color: 0xe74c3c, hp: 26, maxHp: 26, str: 10, skl: 8, spd: 8, lck: 3, def: 6, con: 10, mov: 5, weapon: { type: 'sword', mt: 11, hit: 70, crit: 0, wt: 12 } }
    ];

    let selectedUnit = null;
    let moveTiles = [];

    function logMsg(text) {
      const box = document.getElementById('log-box');
      box.innerHTML += `<br>> ${text}`;
      box.scrollTop = box.scrollHeight;
    }

    class BattleScene extends Phaser.Scene {
      constructor() { super('BattleScene'); }
      create() {
        this.graphics = this.add.graphics();
        this.drawGrid();

        unitsData.forEach(u => {
          const container = this.add.container(u.x * TILE_SIZE + TILE_SIZE/2, u.y * TILE_SIZE + TILE_SIZE/2);
          const circle = this.add.circle(0, 0, 18, u.color);
          const label = this.add.text(-8, -8, u.team === 'player' ? 'P' : 'E', { fontSize: '14px', fill: '#fff', fontStyle: 'bold' });
          const hpBg = this.add.rectangle(0, 20, 32, 4, 0x000000);
          const hpBar = this.add.rectangle(-16, 20, 32, 4, 0x2ecc71).setOrigin(0, 0.5);
          container.add([circle, label, hpBg, hpBar]);
          u.sprite = container;
          u.hpBar = hpBar;
        });

        this.input.on('pointerdown', (ptr) => {
          const gx = Math.floor(ptr.x / TILE_SIZE);
          const gy = Math.floor(ptr.y / TILE_SIZE);
          if (gx >= 0 && gx < GRID_SIZE && gy >= 0 && gy < GRID_SIZE) {
            this.handleTileClick(gx, gy);
          }
        });
      }

      drawGrid() {
        this.graphics.clear();
        for (let y = 0; y < GRID_SIZE; y++) {
          for (let x = 0; x < GRID_SIZE; x++) {
            this.graphics.lineStyle(1, 0x33334d, 1);
            this.graphics.fillStyle((x + y) % 2 === 0 ? 0x22223b : 0x2a2a4a, 1);
            this.graphics.fillRect(x * TILE_SIZE, y * TILE_SIZE, TILE_SIZE, TILE_SIZE);
            this.graphics.strokeRect(x * TILE_SIZE, y * TILE_SIZE, TILE_SIZE, TILE_SIZE);
          }
        }
        moveTiles.forEach(t => {
          this.graphics.fillStyle(0x2ecc71, 0.4);
          this.graphics.fillRect(t.x * TILE_SIZE, t.y * TILE_SIZE, TILE_SIZE, TILE_SIZE);
        });
      }

      handleTileClick(gx, gy) {
        const target = unitsData.find(u => u.x === gx && u.y === gy && u.hp > 0);
        if (target && target.team === 'player') {
          selectedUnit = target;
          moveTiles = [];
          for (let y = 0; y < GRID_SIZE; y++) {
            for (let x = 0; x < GRID_SIZE; x++) {
              if (Math.abs(target.x - x) + Math.abs(target.y - y) <= target.mov) moveTiles.push({x, y});
            }
          }
          this.drawGrid();
          logMsg(`Đã chọn ${target.name}`);
          return;
        }

        if (selectedUnit) {
          if (target && target.team === 'enemy') {
            const dist = Math.abs(selectedUnit.x - target.x) + Math.abs(selectedUnit.y - target.y);
            if (dist === 1) {
              this.startBattle(selectedUnit, target);
              selectedUnit = null;
              moveTiles = [];
              this.drawGrid();
              return;
            }
          }
          if (moveTiles.some(t => t.x === gx && t.y === gy) && !target) {
            selectedUnit.x = gx;
            selectedUnit.y = gy;
            this.tweens.add({ targets: selectedUnit.sprite, x: gx * TILE_SIZE + TILE_SIZE/2, y: gy * TILE_SIZE + TILE_SIZE/2, duration: 200 });
            logMsg(`${selectedUnit.name} di chuyển đến (${gx}, ${gy})`);
            moveTiles = [];
            this.drawGrid();
          }
        }
      }

      startBattle(att, def) {
        const popup = document.getElementById('battle-popup');
        const attHpUI = document.getElementById('bp-att-hp');
        const defHpUI = document.getElementById('bp-def-hp');
        const sub = document.getElementById('bp-sub');

        popup.style.display = 'flex';
        attHpUI.innerText = `HP: ${att.hp}/${att.maxHp}`;
        defHpUI.innerText = `HP: ${def.hp}/${def.maxHp}`;
        sub.innerText = `Giao tranh: ${att.name} vs ${def.name}`;
        logMsg(`--- GIAO TRANH: ${att.name} vs ${def.name} ---`);

        let step = 0;
        const timer = setInterval(() => {
          if (step === 0) {
            this.strike(att, def, defHpUI, sub);
          } else if (step === 1) {
            if (def.hp > 0) this.strike(def, att, attHpUI, sub);
          } else {
            clearInterval(timer);
            setTimeout(() => { popup.style.display = 'none'; }, 1000);
          }
          step++;
        }, 1200);
      }

      strike(att, def, hpUI, sub) {
        const hitChance = 90;
        if (Math.random() * 100 < hitChance) {
          const dmg = Math.max(1, (att.str + att.weapon.mt) - def.def);
          def.hp = Math.max(0, def.hp - dmg);
          def.hpBar.setScale(def.hp / def.maxHp, 1);
          hpUI.innerText = `HP: ${def.hp}/${def.maxHp}`;
          logMsg(`💥 ${att.name} đánh trúng! ${def.name} -${dmg} HP (Còn ${def.hp})`);
          sub.innerText = `💥 ${att.name} đánh trúng -${dmg} HP!`;
          if (def.hp === 0) {
            logMsg(`💀 ${def.name} đã gục ngã!`);
            def.sprite.setVisible(false);
          }
        } else {
          logMsg(`💨 ${att.name} đánh trượt!`);
          sub.innerText = `💨 ${att.name} đánh trượt!`;
        }
      }
    }

    new Phaser.Game({
      type: Phaser.AUTO,
      width: TILE_SIZE * GRID_SIZE,
      height: TILE_SIZE * GRID_SIZE,
      parent: 'game-container',
      pixelArt: true,
      scene: BattleScene
    });
  </script>
</body>
</html>
