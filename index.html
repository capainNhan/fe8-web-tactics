
<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
  >
  <title>FE8 Web Tactics</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 10px 0;
      background: #1a1a2e;
      color: white;
      font-family: monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Khung game vuông, to nhất có thể theo cửa sổ (tối đa 960px).
       Độ phân giải thật của game là 768x768 (xem UI_SCALE trong js/config.js). */
    :root {
      --size: max(320px, min(96vw, calc(100vh - 200px), 960px));
    }

    #game-container {
      width: var(--size);
      height: var(--size);
      position: relative;
      border: 2px solid #4ecca3;
      box-shadow: 0 4px 15px #0008;
    }

    #log-box {
      width: var(--size);
      height: 130px;
      margin-top: 10px;
      padding: 7px;
      overflow-y: auto;
      background: #0f0f1a;
      border: 1px solid #444;
      font-size: 13px;
      line-height: 1.5;
    }
  </style>

  <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
</head>

<body>
  <div id="game-container"></div>

  <div id="log-box">
    FE8 Web Tactics - Chạm Kỵ Sĩ rồi chọn địch cạnh bên để chiến đấu.
  </div>

  <script type="module" src="./js/main.js"></script>
</body>
</html>
